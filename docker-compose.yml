services:
  rap_client_frontend:
    restart: unless-stopped
    networks:
      - internet-facing
    build:
      context: ./clientFrontend
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

  rap_admin_frontend:
    restart: unless-stopped
    networks:
      - internet-facing
    build:
      context: ./adminFrontend
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

networks:
  internet-facing:
    external: true
