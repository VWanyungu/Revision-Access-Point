name: Build and Push Docker Image

on:
  pull_request:
    branches:
      - main

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_NAME: revision-access-point-main

jobs:
  docker-build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          buildkitd-flags: --debug
          driver-opts: network=host

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Update docker-compose with image tag
        run: |
           # Get the first service name
            SERVICE_NAME=$(docker-compose config --services | head -n1)
            echo "Service name: $SERVICE_NAME"
            
            # Get the first tag safely
            FIRST_TAG=$(echo '${{ steps.meta.outputs.tags }}' | cut -d',' -f1 | tr -d '\n')
            echo "First tag: $FIRST_TAG"
            
            if [ -z "$FIRST_TAG" ]; then
              echo "Error: FIRST_TAG is empty"
              exit 1
            fi
            
            # Check if docker-compose.yml exists
            if [ ! -f "docker-compose.yml" ]; then
              echo "Error: docker-compose.yml not found"
              exit 1
            fi
            
            # Update docker-compose.yml with the new tag
            sed -i "s|image:.*|image: ${FIRST_TAG}|g" docker-compose.yml
            echo "Updated docker-compose.yml:"
            grep "image:" docker-compose.yml

      - name: Build and push using docker-compose
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max